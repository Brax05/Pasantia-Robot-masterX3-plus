# Archivo: robot_control.yaml
#
# Proposito general:
#   Configuracion central del controlador seguro y la telemetria del robot
#   mascota. Aqui se declaran topics, limites de velocidad, watchdog,
#   tiempos de parada y chequeos TF.
#
# Informacion util:
#   Estos valores son conservadores para Semana 1. Si el robot fisico se mueve
#   muy lento o muy rapido, ajustar primero default_linear_speed,
#   default_turn_speed y los maximos antes de tocar el codigo.

# Topics de comando/control.
cmd_vel_topic: /cmd_vel
command_topic: /robot/command
direct_twist_topic: /robot/cmd_vel_safe
mode_topic: /robot/mode
emergency_stop_topic: /robot/emergency_stop
controller_state_topic: /robot/controller_state
controller_event_topic: /robot/events
robot_status_topic: /robot/status

# Topics de contexto observado.
autopilot_state_topic: /pet_behavior/autopilot_state
joy_topic: /JoyState
scan_topic: /scan
vel_raw_topic: /vel_raw
odom_raw_topic: /odom_raw
odom_topic: /odom
voltage_topic: /voltage
imu_raw_topic: /imu/data_raw
imu_alt_raw_topic: /imu/imu_raw
imu_filtered_topic: /imu/imu_data

# Limites conservadores de movimiento para Semana 1.
default_mode: idle

# Velocidad maxima de avance/retroceso. Si pides mas, el controller recorta aqui.
max_linear_x: 0.22

# Movimiento lateral desactivado para esta base.
max_linear_y: 0.0

# Velocidad maxima de giro. Si el robot gira muy brusco, bajar este valor.
max_angular_z: 0.70

# Velocidad minima util: un avance menor que esto sube a este valor.
min_effective_linear_x: 0.16

# Minimo de giro util. En 0.0 no fuerza giros pequenos.
min_effective_angular_z: 0.0

# Velocidad usada si el comando no trae speed.
default_linear_speed: 0.18

# Giro usado si el comando no trae angular/turn_speed.
default_turn_speed: 0.55

# Tiempos de seguridad.

# Frecuencia con que el controller publica /cmd_vel mientras controla.
controller_publish_rate: 10.0

# Frecuencia con que se publica /robot/status.
status_publish_rate: 2.0

# Duracion usada si el comando no trae duration.
default_command_duration: 0.6

# Duracion maxima aceptada aunque el comando pida mas.
max_command_duration: 5.0

# Corte de seguridad si un comando activo dura demasiado sin refrescarse.
watchdog_timeout: 5.5

# Tiempo extra publicando velocidad cero despues de detener.
stop_publish_duration: 0.6

# Tiempo para considerar vivo un topic en /robot/status.
topic_fresh_timeout: 2.0

# Compuertas de seguridad.

# Angulo frontal que se revisa para obstaculos con LiDAR.
front_angle_deg: 25.0

# Si es true, un obstaculo frontal bloquea avanzar.
front_obstacle_blocks_forward: true

# Si es true, joystick/manual bloquea comandos del backend.
manual_blocks_commands: true

# Chequeos TF mostrados en /robot/status.
tf_checks:
  - parent: odom
    child: base_footprint
  - parent: base_link
    child: laser
  - parent: laser_link
    child: laser
